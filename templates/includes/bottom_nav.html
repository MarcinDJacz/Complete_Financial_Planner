{% load static %}
<nav class="d-flex justify-content-center py-2">
  <ul class="list-unstyled d-flex gap-3 mb-0">
    <li>
      <a href="{% url 'planner:index' %}" class="nav-icon d-flex align-items-center justify-content-center">
        <img src="{% static 'icons/home.svg' %}" alt="Home"/>
      </a>
    </li>

    <li>
      <a href="{% url 'planner:inmates_list' %}" class="nav-icon d-flex align-items-center justify-content-center">
        <img src="{% static 'icons/inmates.svg' %}" alt="Inmates"/>
      </a>
    </li>

    <li>
      <a href="{% url 'planner:operations' %}" class="nav-icon d-flex align-items-center justify-content-center">
        <img src="{% static 'icons/operations.svg' %}" alt="Operations"/>
      </a>
    </li>
    <li>
      <a href="{% url 'planner:dashboard' %}" class="nav-icon d-flex align-items-center justify-content-center">
        <img src="{% static 'icons/charts.svg' %}" alt="Charts"/>
      </a>
    </li>
    <li>
      {% if user.is_authenticated %}
      <a href="{% url 'planner:messages_list' %}" class="nav-icon d-flex align-items-center justify-content-center">
        <img src="{% static 'icons/contact.svg' %}" alt="Settings"/>
      </a>
      {% else %}
      <a href="{% url 'planner:contact' %}" class="nav-icon d-flex align-items-center justify-content-center">
        <img src="{% static 'icons/contact.svg' %}" alt="Settings"/>
      </a>
      {% endif %}
    </li>
    <li>
      <a href="{% url 'planner:user_settings' %}" class="nav-icon d-flex align-items-center justify-content-center">
        <img src="{% static 'icons/settings.svg' %}" alt="Contact"/>
      </a>
    </li>

  </ul>
</nav>
